{% extends "base.html" %}
{% block content %}
<div class="success-container">
    <h2>✅ Бронирование подтверждено!</h2>
    <p>{{ date }} с {{ time }}, на {{ guests }} персон. Спасибо!</p>
    <a href="{{ url_for('profile') }}" class="btn-primary">Мои бронирования</a>
</div>
<style>
.success-container {
    text-align: center;
    background: var(--black-40);
    border-radius: 32px;
    padding: 3rem;
    max-width: 600px;
    margin: 2rem auto;
}
</style>
{% endblock %}
